<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190"
     width="880" height="190" role="img" aria-labelledby="t d">
  <title id="t">MiraLM-47M</title>
  <desc id="d">Animated banner with the parameter budget filling to 47,640,968 of the 50,000,000 cap.</desc>
  <rect width="880" height="190" fill="#0d1117"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#39c5cf"><animate attributeName="stop-color" values="#39c5cf;#a371f7;#39c5cf" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.33" stop-color="#a371f7"><animate attributeName="stop-color" values="#a371f7;#f0b429;#a371f7" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.67" stop-color="#f0b429"><animate attributeName="stop-color" values="#f0b429;#39c5cf;#f0b429" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1.00" stop-color="#39c5cf"><animate attributeName="stop-color" values="#39c5cf;#39c5cf;#39c5cf" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="52" width="880" height="3" fill="url(#g)"><animate attributeName="x" values="0;880" dur="7s" repeatCount="indefinite"/></rect>
  <rect x="0" y="52" width="120" height="3" fill="#39c5cf" opacity="0.9"><animate attributeName="x" values="880;-120" dur="3.5s" repeatCount="indefinite"/></rect>
  <text x="440" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="46" font-weight="700" fill="#e6edf3" text-anchor="middle">MiraLM-47M</text>
  <text x="440" y="86" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="500" fill="#39c5cf" text-anchor="middle">Sparse MoE  x  Mamba  x  GQA  -  47,640,968 params</text>
  <rect x="300" y="116" width="280" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="300" y="116" width="0" height="10" rx="5" fill="#f0b429"><animate attributeName="width" values="0;266" dur="1.6s" fill="freeze"/></rect>
  <text x="288" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end">0</text>
  <text x="592" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">50M</text>
  <text x="440" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">47,640,968 trainable  ·  2,359,032 headroom  ·  38,793,608 active</text>
  <text x="440" y="172" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#3fb950" text-anchor="middle">trained from scratch  ·  no pretrained weights  ·  1x T4  ·  GIBC V2 Track 01</text>
</svg>
